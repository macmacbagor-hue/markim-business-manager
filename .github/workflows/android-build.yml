
name: Build M4RK1M Android APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q M4RK1M_Business_Manager_V2.zip -d project
          find project -name settings.gradle

      - name: Build Debug APK
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find project -name settings.gradle -print -quit)")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          echo "Project folder: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M4RK1M-Business-Manager-V2-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
